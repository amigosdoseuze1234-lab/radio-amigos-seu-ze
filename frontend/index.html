<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="format-detection" content="telephone=no">
    <title>Rádio Amigos do Seu Zé</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            min-height: 100dvh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            overscroll-behavior-y: none;
            -webkit-overflow-scrolling: touch;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Header */
        .header {
            text-align: center;
            padding: 30px 20px 20px;
            width: 100%;
            padding-top: max(30px, env(safe-area-inset-top));
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            flex-shrink: 0;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #e94560);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .status-badge.online {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .status-badge.offline {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        .status-badge.connecting {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
            animation: pulse 1.5s infinite;
        }

        .status-badge.buffering {
            background: rgba(0, 150, 255, 0.15);
            color: #0096ff;
            border: 1px solid rgba(0, 150, 255, 0.3);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }

        /* Player Card */
        .player-card {
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            margin: 20px auto;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* Album Art */
        .album-art {
            width: 180px;
            height: 180px;
            margin: 0 auto 25px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            background: linear-gradient(135deg, #1a1a2e, #16213e);
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .album-art-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
        }

        /* Visualizer */
        .visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            height: 30px;
            margin-bottom: 20px;
        }

        .bar {
            width: 4px;
            background: linear-gradient(to top, #e94560, #ff6b6b);
            border-radius: 2px;
            transition: height 0.1s ease;
            height: 5px;
            will-change: height;
        }

        /* Track Info */
        .track-info {
            margin-bottom: 20px;
        }

        .track-label {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
        }

        .track-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #fff;
            min-height: 28px;
            word-break: break-word;
            line-height: 1.3;
        }

        .track-artist {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
            touch-action: manipulation;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            -webkit-appearance: none;
            appearance: none;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            overflow: hidden;
        }

        .control-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        .control-btn:active::after {
            width: 100%;
            height: 100%;
        }

        .control-btn:active {
            transform: scale(0.92);
        }

        .control-btn.play-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            font-size: 28px;
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .control-btn.play-btn:active {
            transform: scale(0.92);
            box-shadow: 0 3px 12px rgba(233, 69, 96, 0.3);
        }

        .control-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Volume */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .volume-slider {
            width: 120px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
            border: none;
        }

        /* Chat Section */
        .chat-section {
            width: 90%;
            max-width: 400px;
            margin: 0 auto 40px;
            margin-bottom: max(40px, env(safe-area-inset-bottom));
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .chat-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-online-count {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }

        .chat-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 320px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 85%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.own {
            align-self: flex-end;
            align-items: flex-end;
        }

        .chat-message.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .chat-message.system {
            align-self: center;
            align-items: center;
        }

        .chat-message.system .chat-bubble {
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            font-style: italic;
            border-radius: 12px;
        }

        .chat-message.own .chat-bubble {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .chat-message.other .chat-bubble {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-bottom-left-radius: 4px;
        }

        .chat-bubble {
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
            max-width: 100%;
        }

        .chat-meta {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
        }

        .chat-input {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 8px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        .chat-input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .chat-send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            flex-shrink: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        .chat-send-btn:active {
            transform: scale(0.92);
        }

        .chat-send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .chat-typing {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            padding: 0 12px 6px;
            font-style: italic;
            min-height: 18px;
        }

        .chat-name-input {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
        }

        .chat-name-input input {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 8px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        .chat-name-input input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .chat-name-input button {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .chat-name-input button:active {
            transform: scale(0.95);
        }

        /* Error Message */
        .error-message {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            max-width: 90%;
            word-break: break-word;
        }

        .error-message.show {
            display: block;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            word-break: break-word;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* First interaction overlay for mobile */
        .interaction-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .interaction-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .interaction-overlay-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 300px;
            margin: 20px;
        }

        .interaction-overlay-content .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .interaction-overlay-content h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .interaction-overlay-content p {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 20px;
        }

        .interaction-overlay-content button {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .logo h1 {
                font-size: 22px;
            }

            .player-card {
                padding: 20px;
                width: 95%;
                border-radius: 20px;
            }

            .album-art {
                width: 150px;
                height: 150px;
            }

            .controls {
                gap: 15px;
            }

            .control-btn {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }

            .control-btn.play-btn {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }

            .track-title {
                font-size: 18px;
            }

            .chat-container {
                height: 280px;
            }
        }

        /* Reduce motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🎧</div>
            <h1>Amigos do Seu Zé</h1>
        </div>
        <div class="status-badge connecting" id="statusBadge">
            <span class="status-dot"></span>
            <span id="statusText">Conectando...</span>
        </div>
    </div>

    <!-- Error Message -->
    <div class="error-message" id="errorMessage"></div>

    <!-- Player Card -->
    <div class="player-card">
        <!-- Album Art -->
        <div class="album-art">
            <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&h=400&fit=crop" 
                 alt="Album Art" 
                 id="albumArt"
                 onerror="this.src='https://via.placeholder.com/400x400/1a1a2e/e94560?text=🎵'"
                 loading="lazy"
                 decoding="async">
            <div class="album-art-overlay">Ponto de Umbanda</div>
        </div>

        <!-- Visualizer -->
        <div class="visualizer" id="visualizer">
            <div class="bar" style="height: 5px;"></div>
            <div class="bar" style="height: 8px;"></div>
            <div class="bar" style="height: 12px;"></div>
            <div class="bar" style="height: 6px;"></div>
            <div class="bar" style="height: 15px;"></div>
            <div class="bar" style="height: 10px;"></div>
            <div class="bar" style="height: 7px;"></div>
            <div class="bar" style="height: 14px;"></div>
            <div class="bar" style="height: 9px;"></div>
            <div class="bar" style="height: 11px;"></div>
        </div>

        <!-- Track Info -->
        <div class="track-info">
            <div class="track-label">Tocando Agora</div>
            <div class="track-title" id="trackTitle">Conectando ao stream...</div>
            <div class="track-artist" id="trackArtist">Aguardando transmissão</div>
        </div>

        <!-- Progress -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-time">
                <span id="currentTime">0:00</span>
                <span id="totalTime">AO VIVO</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="control-btn" id="prevBtn" title="Anterior" type="button" aria-label="Música anterior">⏮</button>
            <button class="control-btn" id="stopBtn" title="Parar" type="button" aria-label="Parar">⏹</button>
            <button class="control-btn play-btn" id="playBtn" title="Play/Pause" type="button" aria-label="Play ou Pausa">▶</button>
            <button class="control-btn" id="muteBtn" title="Mudo" type="button" aria-label="Ativar ou desativar som">🔊</button>
            <button class="control-btn" id="nextBtn" title="Próxima" type="button" aria-label="Próxima música">⏭</button>
        </div>

        <!-- Volume -->
        <div class="volume-container">
            <span aria-hidden="true">🔈</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" aria-label="Volume">
            <span aria-hidden="true">🔊</span>
        </div>
    </div>

    <!-- Chat Section -->
    <div class="chat-section">
        <div class="chat-header">
            <div class="chat-title">💬 Chat ao Vivo</div>
            <div class="chat-online-count" id="chatOnlineCount">0 ouvintes</div>
        </div>
        <div class="chat-container" id="chatContainer">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-message system">
                    <div class="chat-bubble">👋 Bem-vindo ao chat da Rádio Amigos do Seu Zé!</div>
                </div>
            </div>
            <div class="chat-typing" id="chatTyping"></div>
            <div class="chat-name-input" id="chatNameInput">
                <input type="text" id="chatNameField" placeholder="Digite seu nome..." maxlength="20">
                <button id="chatNameBtn">Entrar</button>
            </div>
            <div class="chat-input-area" id="chatInputArea" style="display: none;">
                <input type="text" class="chat-input" id="chatInput" placeholder="Digite sua mensagem..." maxlength="200">
                <button class="chat-send-btn" id="chatSendBtn">➤</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Mobile Interaction Overlay -->
    <div class="interaction-overlay" id="interactionOverlay">
        <div class="interaction-overlay-content">
            <div class="icon">🎵</div>
            <h3>Toque para começar</h3>
            <p>Seu navegador requer uma interação inicial para tocar áudio</p>
            <button id="startAudioBtn">Começar</button>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" 
           preload="metadata" 
           crossorigin="anonymous" 
           playsinline 
           webkit-playsinline
           x-webkit-airplay="allow"></audio>

    <script>
        /**
         * Rádio Amigos do Seu Zé - Player Ultra-Compatível
         * Android, iPhone, iPad, Desktop - Todos os navegadores
         */

        (function() {
            'use strict';

            const RadioPlayer = {
                // DOM Elements
                audio: null,
                playBtn: null,
                stopBtn: null,
                prevBtn: null,
                nextBtn: null,
                muteBtn: null,
                volumeSlider: null,
                trackTitle: null,
                trackArtist: null,
                progressBar: null,
                progressFill: null,
                currentTime: null,
                statusBadge: null,
                statusText: null,
                errorMessage: null,
                visualizer: null,
                toast: null,
                interactionOverlay: null,
                startAudioBtn: null,

                // Chat Elements
                chatMessages: null,
                chatInput: null,
                chatSendBtn: null,
                chatNameInput: null,
                chatNameField: null,
                chatNameBtn: null,
                chatInputArea: null,
                chatTyping: null,
                chatOnlineCount: null,

                // State
                tracks: [],
                currentTrackIndex: 0,
                isPlaying: false,
                isMuted: false,
                previousVolume: 80,
                visualizerInterval: null,
                ws: null,
                wsReconnectTimer: null,
                apiRetryCount: 0,
                maxApiRetries: 3,
                isMobile: false,
                isIOS: false,
                isAndroid: false,
                isSafari: false,
                audioContext: null,
                userInteracted: false,
                autoplayBlocked: false,

                // Chat State
                chatUserName: '',
                chatWs: null,
                chatWsReconnectTimer: null,

                init() {
                    this.detectDevice();
                    this.cacheElements();
                    if (!this.audio) {
                        console.error('Audio element not found');
                        return;
                    }
                    this.bindEvents();
                    this.setupAudioEvents();
                    this.loadPlaylist();
                    this.connectWebSocket();
                    this.setVolume(80);
                    this.initChat();
                    this.checkAutoplayPolicy();
                },

                detectDevice() {
                    const ua = navigator.userAgent.toLowerCase();
                    this.isIOS = /iphone|ipad|ipod/.test(ua);
                    this.isAndroid = /android/.test(ua);
                    this.isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
                    this.isMobile = this.isIOS || this.isAndroid || /mobile/.test(ua);
                    console.log('Device:', this.isIOS ? 'iOS' : this.isAndroid ? 'Android' : 'Desktop', 
                                'Safari:', this.isSafari);
                },

                cacheElements() {
                    this.audio = document.getElementById('audioPlayer');
                    this.playBtn = document.getElementById('playBtn');
                    this.stopBtn = document.getElementById('stopBtn');
                    this.prevBtn = document.getElementById('prevBtn');
                    this.nextBtn = document.getElementById('nextBtn');
                    this.muteBtn = document.getElementById('muteBtn');
                    this.volumeSlider = document.getElementById('volumeSlider');
                    this.trackTitle = document.getElementById('trackTitle');
                    this.trackArtist = document.getElementById('trackArtist');
                    this.progressBar = document.getElementById('progressBar');
                    this.progressFill = document.getElementById('progressFill');
                    this.currentTime = document.getElementById('currentTime');
                    this.statusBadge = document.getElementById('statusBadge');
                    this.statusText = document.getElementById('statusText');
                    this.errorMessage = document.getElementById('errorMessage');
                    this.visualizer = document.getElementById('visualizer');
                    this.toast = document.getElementById('toast');
                    this.interactionOverlay = document.getElementById('interactionOverlay');
                    this.startAudioBtn = document.getElementById('startAudioBtn');

                    // Chat elements
                    this.chatMessages = document.getElementById('chatMessages');
                    this.chatInput = document.getElementById('chatInput');
                    this.chatSendBtn = document.getElementById('chatSendBtn');
                    this.chatNameInput = document.getElementById('chatNameInput');
                    this.chatNameField = document.getElementById('chatNameField');
                    this.chatNameBtn = document.getElementById('chatNameBtn');
                    this.chatInputArea = document.getElementById('chatInputArea');
                    this.chatTyping = document.getElementById('chatTyping');
                    this.chatOnlineCount = document.getElementById('chatOnlineCount');
                },

                getBaseUrl() {
                    return window.location.origin;
                },

                // ===== AUTPLAY DETECTION =====
                async checkAutoplayPolicy() {
                    if (navigator.getAutoplayPolicy) {
                        const policy = navigator.getAutoplayPolicy('mediaelement');
                        console.log('Autoplay policy:', policy);
                        if (policy === 'disallowed') {
                            this.autoplayBlocked = true;
                        }
                        return;
                    }

                    if (this.isMobile || this.isSafari) {
                        const testAudio = new Audio();
                        testAudio.volume = 0;
                        try {
                            await testAudio.play();
                            testAudio.pause();
                            console.log('Autoplay allowed');
                        } catch (err) {
                            console.log('Autoplay blocked:', err.name);
                            this.autoplayBlocked = true;
                        }
                    }
                },

                // ===== EVENT BINDING =====
                bindEvents() {
                    this.bindTouch(this.playBtn, (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.handleUserInteraction();
                        this.togglePlay();
                    });

                    this.bindTouch(this.stopBtn, (e) => {
                        e.preventDefault();
                        this.handleUserInteraction();
                        this.stop();
                    });

                    this.bindTouch(this.prevBtn, (e) => {
                        e.preventDefault();
                        this.handleUserInteraction();
                        this.previousTrack();
                    });

                    this.bindTouch(this.nextBtn, (e) => {
                        e.preventDefault();
                        this.handleUserInteraction();
                        this.nextTrack();
                    });

                    this.bindTouch(this.muteBtn, (e) => {
                        e.preventDefault();
                        this.handleUserInteraction();
                        this.toggleMute();
                    });

                    this.volumeSlider.addEventListener('input', (e) => {
                        this.setVolume(e.target.value);
                    });

                    this.bindTouch(this.progressBar, (e) => {
                        e.preventDefault();
                        const rect = this.progressBar.getBoundingClientRect();
                        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                        const percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                        this.seek(percent);
                    });

                    if (this.startAudioBtn) {
                        this.bindTouch(this.startAudioBtn, (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            this.handleUserInteraction();
                            this.hideInteractionOverlay();
                            this.togglePlay();
                        });
                    }

                    const firstInteraction = () => {
                        this.handleUserInteraction();
                        document.removeEventListener('touchstart', firstInteraction);
                        document.removeEventListener('click', firstInteraction);
                    };
                    document.addEventListener('touchstart', firstInteraction, { once: true, passive: true });
                    document.addEventListener('click', firstInteraction, { once: true });

                    document.addEventListener('visibilitychange', () => {
                        if (document.hidden) {
                            this.pauseVisualizer();
                        } else if (this.isPlaying) {
                            this.startVisualizer();
                        }
                    });

                    window.addEventListener('online', () => {
                        this.showToast('Conexão restaurada');
                        if (this.tracks.length === 0) {
                            this.loadPlaylist();
                        }
                    });

                    window.addEventListener('offline', () => {
                        this.showToast('Sem conexão com a internet');
                        this.setStatus('offline', 'Sem conexão');
                    });
                },

                handleUserInteraction() {
                    if (!this.userInteracted) {
                        this.userInteracted = true;
                        console.log('User interaction detected');
                        if (this.isIOS || this.isSafari) {
                            this.initAudioContext();
                        }
                    }
                },

                showInteractionOverlay() {
                    if (this.interactionOverlay && this.autoplayBlocked && !this.userInteracted) {
                        this.interactionOverlay.classList.add('show');
                    }
                },

                hideInteractionOverlay() {
                    if (this.interactionOverlay) {
                        this.interactionOverlay.classList.remove('show');
                    }
                },

                bindTouch(element, handler) {
                    if (!element) return;

                    element.addEventListener('pointerdown', (e) => {
                        handler(e);
                    });

                    element.addEventListener('touchstart', (e) => {
                    }, { passive: true });

                    element.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        handler(e);
                    }, { passive: false });

                    element.addEventListener('click', (e) => {
                        handler(e);
                    });
                },

                // ===== AUDIO EVENTS =====
                setupAudioEvents() {
                    const audio = this.audio;

                    audio.addEventListener('play', () => {
                        this.isPlaying = true;
                        this.updatePlayButton();
                        this.setStatus('online', 'Tocando');
                        this.startVisualizer();
                        this.hideInteractionOverlay();
                    });

                    audio.addEventListener('pause', () => {
                        this.isPlaying = false;
                        this.updatePlayButton();
                        this.stopVisualizer();
                    });

                    audio.addEventListener('ended', () => {
                        console.log('Track ended, playing next');
                        this.nextTrack();
                    });

                    audio.addEventListener('error', (e) => {
                        console.error('Audio error:', e, 'code:', audio.error ? audio.error.code : 'unknown');
                        this.handleAudioError();
                    });

                    audio.addEventListener('timeupdate', () => {
                        this.updateProgress();
                    });

                    audio.addEventListener('waiting', () => {
                        this.setStatus('buffering', 'Carregando...');
                    });

                    audio.addEventListener('canplay', () => {
                        if (this.isPlaying) {
                            this.setStatus('online', 'Tocando');
                        } else {
                            this.setStatus('online', 'Pronto');
                        }
                        this.hideError();
                    });

                    audio.addEventListener('canplaythrough', () => {
                        this.setStatus('online', 'Tocando');
                    });

                    audio.addEventListener('loadedmetadata', () => {
                        this.updateProgress();
                    });

                    audio.addEventListener('stalled', () => {
                        console.warn('Audio stalled');
                        this.setStatus('buffering', 'Reconectando...');
                    });

                    audio.addEventListener('suspend', () => {
                        console.log('Audio suspended (buffering)');
                    });
                },

                handleAudioError() {
                    const error = this.audio.error;
                    let msg = 'Erro ao carregar áudio.';
                    let shouldRetry = false;

                    if (error) {
                        switch(error.code) {
                            case 1:
                                msg = 'Reprodução interrompida.';
                                break;
                            case 2:
                                msg = 'Erro de rede. Verificando conexão...';
                                shouldRetry = true;
                                break;
                            case 3:
                                msg = 'Erro de decodificação. Tentando próxima música...';
                                shouldRetry = true;
                                break;
                            case 4:
                                msg = 'Formato não suportado ou arquivo não encontrado.';
                                break;
                        }
                    }

                    this.showError(msg);
                    this.setStatus('offline', 'Erro');
                    this.stopVisualizer();

                    if (shouldRetry && this.tracks.length > 0) {
                        setTimeout(() => {
                            console.log('Retrying next track...');
                            this.nextTrack();
                        }, 2000);
                    }
                },

                // ===== AUDIO CONTEXT (iOS) =====
                initAudioContext() {
                    try {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) {
                            if (!this.audioContext) {
                                this.audioContext = new AudioContext();
                            }
                            if (this.audioContext.state === 'suspended') {
                                this.audioContext.resume().then(() => {
                                    console.log('AudioContext resumed');
                                });
                            }
                        }
                    } catch (e) {
                        console.log('AudioContext not available:', e);
                    }
                },

                // ===== PLAYLIST =====
                async loadPlaylist() {
                    this.setStatus('connecting', 'Carregando músicas...');

                    try {
                        const baseUrl = this.getBaseUrl();
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 15000);

                        const response = await fetch(`${baseUrl}/api/playlist`, {
                            signal: controller.signal,
                            headers: { 'Accept': 'application/json' }
                        });

                        clearTimeout(timeoutId);

                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }

                        const data = await response.json();
                        this.apiRetryCount = 0;

                        if (Array.isArray(data) && data.length > 0) {
                            this.tracks = data.map(track => ({
                                name: track.title || this.cleanFileName(track.file),
                                file: track.file,
                                artist: track.artist || 'Ponto de Umbanda'
                            }));

                            this.hideError();
                            this.loadTrack(0, true);
                            this.setStatus('online', 'Tocando');
                            console.log(`Playlist loaded: ${this.tracks.length} tracks, autoplay enabled`);
                        } else {
                            throw new Error('Playlist vazia');
                        }

                    } catch (err) {
                        console.error('Load playlist error:', err);
                        this.handlePlaylistError(err);
                    }
                },

                handlePlaylistError(err) {
                    this.apiRetryCount++;

                    if (this.apiRetryCount <= this.maxApiRetries) {
                        const delay = this.apiRetryCount * 2000;
                        console.log(`Retrying playlist load in ${delay}ms (attempt ${this.apiRetryCount})`);
                        this.setStatus('connecting', `Tentando novamente... (${this.apiRetryCount}/${this.maxApiRetries})`);
                        setTimeout(() => this.loadPlaylist(), delay);
                        return;
                    }

                    this.showError('Não foi possível carregar a playlist. Verifique sua conexão.');
                    this.setStatus('offline', 'Servidor indisponível');
                },

                cleanFileName(filename) {
                    if (!filename) return 'Desconhecido';
                    return filename
                        .replace(/\.mp3$/i, '')
                        .replace(/[_-]/g, ' ')
                        .trim();
                },

                // ===== TRACK CONTROL =====
                loadTrack(index, autoPlay) {
                    if (this.tracks.length === 0) return false;

                    index = Math.max(0, Math.min(index, this.tracks.length - 1));
                    this.currentTrackIndex = index;
                    const track = this.tracks[index];
                    const baseUrl = this.getBaseUrl();

                    this.trackTitle.textContent = track.name;
                    this.trackArtist.textContent = track.artist || 'Rádio Amigos do Seu Zé';

                    const audioUrl = `${baseUrl}/audio/${encodeURIComponent(track.file)}`;

                    if (this.audio.src !== audioUrl) {
                        this.audio.src = audioUrl;
                        this.audio.load();
                        console.log('Loading track:', audioUrl);
                    }

                    if (autoPlay) {
                        setTimeout(() => {
                            this.play();
                        }, this.isMobile ? 500 : 200);
                    }

                    return true;
                },

                playTrack(index) {
                    if (!this.loadTrack(index, true)) return;

                    const delay = this.isMobile ? 300 : 100;

                    setTimeout(() => {
                        this.play();
                    }, delay);
                },

                togglePlay() {
                    if (this.isPlaying) {
                        this.pause();
                    } else {
                        this.play();
                    }
                },

                play() {
                    if (this.tracks.length === 0) {
                        this.showError('Nenhuma música disponível');
                        return;
                    }

                    if (!this.audio.src || this.audio.src === window.location.href) {
                        this.loadTrack(this.currentTrackIndex);
                    }

                    if ((this.isIOS || this.isSafari) && !this.userInteracted) {
                        this.showInteractionOverlay();
                        return;
                    }

                    if (this.isIOS || this.isSafari) {
                        this.initAudioContext();
                    }

                    const playPromise = this.audio.play();

                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                this.isPlaying = true;
                                this.updatePlayButton();
                                this.startVisualizer();
                                this.hideInteractionOverlay();
                                console.log('Playback started');
                            })
                            .catch(err => {
                                console.error('Play error:', err.name, err.message);

                                if (err.name === 'NotAllowedError') {
                                    this.autoplayBlocked = true;
                                    if (!this.userInteracted) {
                                        this.showInteractionOverlay();
                                        this.showToast('Toque em Play para iniciar');
                                    } else {
                                        this.showToast('Toque em Play novamente');
                                    }
                                    this.setStatus('online', 'Toque para tocar');
                                } else if (err.name === 'NotSupportedError') {
                                    this.showError('Formato não suportado neste dispositivo');
                                    setTimeout(() => this.nextTrack(), 1500);
                                } else {
                                    this.showError('Erro ao tocar. Tentando novamente...');
                                    setTimeout(() => this.nextTrack(), 1500);
                                }
                            });
                    }
                },

                pause() {
                    this.audio.pause();
                    this.isPlaying = false;
                    this.updatePlayButton();
                    this.stopVisualizer();
                },

                stop() {
                    this.audio.pause();
                    this.audio.currentTime = 0;
                    this.isPlaying = false;
                    this.updatePlayButton();
                    this.stopVisualizer();
                    this.setStatus('online', 'Parado');
                    this.progressFill.style.width = '0%';
                    this.currentTime.textContent = '0:00';
                },

                previousTrack() {
                    if (this.tracks.length === 0) return;
                    const newIndex = (this.currentTrackIndex - 1 + this.tracks.length) % this.tracks.length;
                    this.playTrack(newIndex);
                },

                nextTrack() {
                    if (this.tracks.length === 0) return;
                    const newIndex = (this.currentTrackIndex + 1) % this.tracks.length;
                    this.playTrack(newIndex);
                },

                // ===== VOLUME =====
                toggleMute() {
                    if (this.isMuted) {
                        this.audio.muted = false;
                        this.isMuted = false;
                        this.volumeSlider.value = this.previousVolume || 80;
                        this.setVolume(this.volumeSlider.value);
                        this.muteBtn.textContent = '🔊';
                    } else {
                        this.previousVolume = this.volumeSlider.value;
                        this.audio.muted = true;
                        this.isMuted = true;
                        this.volumeSlider.value = 0;
                        this.muteBtn.textContent = '🔇';
                    }
                },

                setVolume(value) {
                    const volume = Math.max(0, Math.min(100, parseInt(value) || 0)) / 100;
                    this.audio.volume = volume;

                    if (volume === 0) {
                        this.muteBtn.textContent = '🔇';
                        this.isMuted = true;
                        this.audio.muted = true;
                    } else {
                        this.muteBtn.textContent = '🔊';
                        this.isMuted = false;
                        this.audio.muted = false;
                    }
                },

                // ===== PROGRESS =====
                seek(percent) {
                    if (this.audio.duration && isFinite(this.audio.duration) && this.audio.duration > 0) {
                        this.audio.currentTime = percent * this.audio.duration;
                    }
                },

                updateProgress() {
                    const duration = this.audio.duration;
                    const current = this.audio.currentTime;

                    if (duration && isFinite(duration) && duration > 0) {
                        const percent = (current / duration) * 100;
                        this.progressFill.style.width = `${Math.min(100, percent)}%`;
                        this.currentTime.textContent = this.formatTime(current);
                    } else {
                        this.progressFill.style.width = '0%';
                        this.currentTime.textContent = this.formatTime(current);
                    }
                },

                formatTime(seconds) {
                    if (!isFinite(seconds) || isNaN(seconds) || seconds < 0) return '0:00';
                    const mins = Math.floor(seconds / 60);
                    const secs = Math.floor(seconds % 60);
                    return `${mins}:${secs.toString().padStart(2, '0')}`;
                },

                // ===== UI UPDATES =====
                updatePlayButton() {
                    if (this.playBtn) {
                        this.playBtn.textContent = this.isPlaying ? '⏸' : '▶';
                    }
                },

                setStatus(type, text) {
                    if (this.statusBadge && this.statusText) {
                        this.statusBadge.className = `status-badge ${type}`;
                        this.statusText.textContent = text;
                    }
                },

                showError(message) {
                    if (this.errorMessage) {
                        this.errorMessage.textContent = message;
                        this.errorMessage.classList.add('show');
                        setTimeout(() => this.hideError(), 10000);
                    }
                },

                hideError() {
                    if (this.errorMessage) {
                        this.errorMessage.classList.remove('show');
                    }
                },

                showToast(message) {
                    if (this.toast) {
                        this.toast.textContent = message;
                        this.toast.classList.add('show');
                        setTimeout(() => {
                            this.toast.classList.remove('show');
                        }, 3000);
                    }
                },

                escapeHtml(text) {
                    if (!text) return '';
                    const div = document.createElement('div');
                    div.textContent = String(text);
                    return div.innerHTML;
                },

                // ===== VISUALIZER =====
                startVisualizer() {
                    this.stopVisualizer();
                    const bars = this.visualizer.querySelectorAll('.bar');
                    if (!bars.length) return;

                    this.visualizerInterval = setInterval(() => {
                        bars.forEach((bar) => {
                            const height = 5 + Math.random() * 20;
                            bar.style.height = `${height}px`;
                        });
                    }, 120);
                },

                pauseVisualizer() {
                    if (this.visualizerInterval) {
                        clearInterval(this.visualizerInterval);
                        this.visualizerInterval = null;
                    }
                },

                stopVisualizer() {
                    this.pauseVisualizer();
                    const bars = this.visualizer.querySelectorAll('.bar');
                    bars.forEach(bar => {
                        bar.style.height = '5px';
                    });
                },

                // ===== WEBSOCKET =====
                connectWebSocket() {
                    if (this.wsReconnectTimer) {
                        clearTimeout(this.wsReconnectTimer);
                    }

                    try {
                        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                        const wsUrl = `${protocol}//${window.location.host}`;

                        this.ws = new WebSocket(wsUrl);

                        this.ws.onopen = () => {
                            console.log('WebSocket connected');
                            this.ws.send(JSON.stringify({ type: 'ping' }));
                        };

                        this.ws.onmessage = (event) => {
                            try {
                                const data = JSON.parse(event.data);
                                this.handleWsMessage(data);
                            } catch (e) {
                                console.log('WS parse error:', e);
                            }
                        };

                        this.ws.onerror = (err) => {
                            console.log('WebSocket error:', err);
                        };

                        this.ws.onclose = () => {
                            console.log('WebSocket closed, reconnecting in 5s...');
                            this.wsReconnectTimer = setTimeout(() => {
                                this.connectWebSocket();
                            }, 5000);
                        };

                    } catch (e) {
                        console.log('WebSocket not available:', e);
                    }
                },

                handleWsMessage(data) {
                    if (data.type === 'metadata' && data.data) {
                        this.trackTitle.textContent = data.data.title || 'Desconhecido';
                        this.trackArtist.textContent = data.data.artist || 'Ponto de Umbanda';
                    }
                    if (data.type === 'state' && data.data) {
                        const listeners = data.data.listeners || 0;
                        const statusText = this.isPlaying ? 'Tocando' : 'Pronto';
                        this.setStatus('online', `${statusText} · ${listeners} ouvinte${listeners !== 1 ? 's' : ''}`);
                        this.updateChatOnlineCount(listeners);
                    }
                    if (data.type === 'pong') {
                    }
                    // ===== CHAT VIA MESMO WEBSOCKET =====
                    if (data.type === 'chat' && data.name && data.message) {
                        if (data.name !== this.chatUserName) {
                            this.addChatMessage('other', data.name, data.message);
                        }
                    }
                    if (data.type === 'system' && data.message) {
                        this.addChatMessage('system', 'Sistema', data.message);
                    }
                    if (data.type === 'online_count') {
                        this.updateChatOnlineCount(data.count);
                    }
                    if (data.type === 'chat_history' && Array.isArray(data.data)) {
                        data.data.forEach(msg => {
                            if (msg.type === 'chat' && msg.name && msg.message) {
                                const isOwn = msg.name === this.chatUserName;
                                this.addChatMessage(isOwn ? 'own' : 'other', msg.name, msg.message, false);
                            }
                        });
                    }
                },

                // ===== CHAT =====
                initChat() {
                    const savedName = localStorage.getItem('zelar_radio_chat_name');
                    if (savedName) {
                        this.chatUserName = savedName;
                        this.showChatInput();
                        // Notificar servidor que entrou no chat
                        if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                            this.ws.send(JSON.stringify({
                                type: 'join_chat',
                                name: this.chatUserName
                            }));
                        }
                    }

                    this.bindTouch(this.chatNameBtn, (e) => {
                        e.preventDefault();
                        const name = this.chatNameField.value.trim();
                        if (name) {
                            this.chatUserName = name;
                            localStorage.setItem('zelar_radio_chat_name', name);
                            this.showChatInput();
                            this.showToast(`Bem-vindo, ${name}!`);
                            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                                this.ws.send(JSON.stringify({
                                    type: 'join_chat',
                                    name: this.chatUserName
                                }));
                            }
                        }
                    });

                    this.chatNameField.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            this.chatNameBtn.click();
                        }
                    });

                    this.bindTouch(this.chatSendBtn, (e) => {
                        e.preventDefault();
                        this.sendChatMessage();
                    });

                    this.chatInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            this.sendChatMessage();
                        }
                    });
                },

                showChatInput() {
                    this.chatNameInput.style.display = 'none';
                    this.chatInputArea.style.display = 'flex';
                    this.chatInput.focus();
                },

                sendChatMessage() {
                    const text = this.chatInput.value.trim();
                    if (!text || !this.chatUserName) return;

                    this.addChatMessage('own', this.chatUserName, text);
                    this.chatInput.value = '';

                    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                        this.ws.send(JSON.stringify({
                            type: 'chat',
                            name: this.chatUserName,
                            message: text
                        }));
                    }
                },

                addChatMessage(type, name, text, animate = true) {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `chat-message ${type}`;
                    if (!animate) msgDiv.style.animation = 'none';

                    const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                    if (type === 'system') {
                        msgDiv.innerHTML = `<div class="chat-bubble">${this.escapeHtml(text)}</div>`;
                    } else {
                        msgDiv.innerHTML = `
                            <div class="chat-bubble">${this.escapeHtml(text)}</div>
                            <div class="chat-meta">${this.escapeHtml(name)} · ${time}</div>
                        `;
                    }
                    this.chatMessages.appendChild(msgDiv);
                    this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
                },

                updateChatOnlineCount(count) {
                    if (this.chatOnlineCount) {
                        this.chatOnlineCount.textContent = `${count} ouvinte${count !== 1 ? 's' : ''}`;
                    }
                },

                // ===== DESTROY =====
                destroy() {
                    this.stopVisualizer();
                    if (this.ws) {
                        this.ws.close();
                    }
                    if (this.wsReconnectTimer) {
                        clearTimeout(this.wsReconnectTimer);
                    }
                    if (this.audio) {
                        this.audio.pause();
                        this.audio.src = '';
                    }
                    if (this.audioContext) {
                        this.audioContext.close();
                    }
                }
            };

            // Inicializar quando DOM estiver pronto
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => RadioPlayer.init());
            } else {
                RadioPlayer.init();
            }

            // Cleanup
            window.addEventListener('beforeunload', () => {
                RadioPlayer.destroy();
            });

            // Expor globalmente para debug
            window.RadioPlayer = RadioPlayer;

        })();

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.log('SW registration failed:', err);
            });
        }
    </script>
</body>
</html>
