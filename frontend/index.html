<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rádio Amigos do Seu Zé</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 30px 20px 20px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #e94560);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .status-badge.online {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .status-badge.offline {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        .status-badge.connecting {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Player Card */
        .player-card {
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            margin: 20px auto;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* Album Art */
        .album-art {
            width: 180px;
            height: 180px;
            margin: 0 auto 25px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-art-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
        }

        /* Visualizer */
        .visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            height: 30px;
            margin-bottom: 20px;
        }

        .bar {
            width: 4px;
            background: linear-gradient(to top, #e94560, #ff6b6b);
            border-radius: 2px;
            transition: height 0.2s ease;
        }

        .bar.active {
            animation: dance 0.5s ease infinite alternate;
        }

        @keyframes dance {
            0% { height: 5px; }
            100% { height: 25px; }
        }

        /* Track Info */
        .track-info {
            margin-bottom: 20px;
        }

        .track-label {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
        }

        .track-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #fff;
            min-height: 28px;
        }

        .track-artist {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }

        .control-btn.play-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            font-size: 28px;
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .control-btn.play-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 8px 30px rgba(233, 69, 96, 0.6);
        }

        .control-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Volume */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .volume-slider {
            width: 120px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
        }

        /* Playlist */
        .playlist-section {
            width: 90%;
            max-width: 400px;
            margin: 0 auto 40px;
        }

        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .playlist-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .playlist-count {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }

        .playlist {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
            max-height: 300px;
            overflow-y: auto;
        }

        .playlist::-webkit-scrollbar {
            width: 6px;
        }

        .playlist::-webkit-scrollbar-track {
            background: transparent;
        }

        .playlist::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .playlist-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .playlist-item.active {
            background: rgba(233, 69, 96, 0.1);
            border-left: 3px solid #e94560;
        }

        .playlist-item-number {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            width: 25px;
            text-align: center;
        }

        .playlist-item-info {
            flex: 1;
            min-width: 0;
        }

        .playlist-item-title {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-duration {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }

        /* Error Message */
        .error-message {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .logo h1 {
                font-size: 22px;
            }
            
            .player-card {
                padding: 20px;
            }
            
            .album-art {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🎧</div>
            <h1>Amigos do Seu Zé</h1>
        </div>
        <div class="status-badge connecting" id="statusBadge">
            <span class="status-dot"></span>
            <span id="statusText">Conectando...</span>
        </div>
    </div>

    <!-- Error Message -->
    <div class="error-message" id="errorMessage"></div>

    <!-- Player Card -->
    <div class="player-card">
        <!-- Album Art -->
        <div class="album-art">
            <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&h=400&fit=crop" 
                 alt="Album Art" 
                 id="albumArt"
                 onerror="this.src='https://via.placeholder.com/400x400/1a1a2e/e94560?text=🎵'">
            <div class="album-art-overlay">Ponto de Umbanda</div>
        </div>

        <!-- Visualizer -->
        <div class="visualizer" id="visualizer">
            <div class="bar" style="height: 5px;"></div>
            <div class="bar" style="height: 8px;"></div>
            <div class="bar" style="height: 12px;"></div>
            <div class="bar" style="height: 6px;"></div>
            <div class="bar" style="height: 15px;"></div>
            <div class="bar" style="height: 10px;"></div>
            <div class="bar" style="height: 7px;"></div>
            <div class="bar" style="height: 14px;"></div>
            <div class="bar" style="height: 9px;"></div>
            <div class="bar" style="height: 11px;"></div>
        </div>

        <!-- Track Info -->
        <div class="track-info">
            <div class="track-label">Tocando Agora</div>
            <div class="track-title" id="trackTitle">Conectando ao stream...</div>
            <div class="track-artist" id="trackArtist">Aguardando transmissão</div>
        </div>

        <!-- Progress -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-time">
                <span id="currentTime">0:00</span>
                <span id="totalTime">AO VIVO</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="control-btn" id="prevBtn" title="Anterior">⏮</button>
            <button class="control-btn" id="stopBtn" title="Parar">⏹</button>
            <button class="control-btn play-btn" id="playBtn" title="Play/Pause">▶</button>
            <button class="control-btn" id="muteBtn" title="Mudo">🔊</button>
            <button class="control-btn" id="nextBtn" title="Próxima">⏭</button>
        </div>

        <!-- Volume -->
        <div class="volume-container">
            <span>🔈</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
            <span>🔊</span>
        </div>
    </div>

    <!-- Playlist -->
    <div class="playlist-section">
        <div class="playlist-header">
            <div class="playlist-title">🎵 Playlist</div>
            <div class="playlist-count" id="playlistCount">0 músicas</div>
        </div>
        <div class="playlist" id="playlist">
            <div style="text-align: center; padding: 30px; color: rgba(255,255,255,0.3);">
                <div class="loading"></div>
                <p style="margin-top: 10px; font-size: 13px;">Carregando playlist...</p>
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" preload="none"></audio>

    <script>
        /**
         * Rádio Amigos do Seu Zé - Player
         * Reprodução direta de arquivos MP3 via API
         */
        
        const RadioPlayer = {
            audio: document.getElementById('audioPlayer'),
            playBtn: document.getElementById('playBtn'),
            stopBtn: document.getElementById('stopBtn'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            muteBtn: document.getElementById('muteBtn'),
            volumeSlider: document.getElementById('volumeSlider'),
            trackTitle: document.getElementById('trackTitle'),
            trackArtist: document.getElementById('trackArtist'),
            progressBar: document.getElementById('progressBar'),
            progressFill: document.getElementById('progressFill'),
            currentTime: document.getElementById('currentTime'),
            statusBadge: document.getElementById('statusBadge'),
            statusText: document.getElementById('statusText'),
            playlist: document.getElementById('playlist'),
            playlistCount: document.getElementById('playlistCount'),
            errorMessage: document.getElementById('errorMessage'),
            visualizer: document.getElementById('visualizer'),
            
            tracks: [],
            currentTrackIndex: 0,
            isPlaying: false,
            isMuted: false,
            previousVolume: 80,
            
            // Detectar URL base (localhost ou produção)
            getBaseUrl() {
                return window.location.origin;
            },
            
            init() {
                this.bindEvents();
                this.loadPlaylist();
                this.setupAudioEvents();
                this.startVisualizer();
            },
            
            bindEvents() {
                this.playBtn.addEventListener('click', () => this.togglePlay());
                this.stopBtn.addEventListener('click', () => this.stop());
                this.prevBtn.addEventListener('click', () => this.previousTrack());
                this.nextBtn.addEventListener('click', () => this.nextTrack());
                this.muteBtn.addEventListener('click', () => this.toggleMute());
                this.volumeSlider.addEventListener('input', (e) => this.setVolume(e.target.value));
                
                this.progressBar.addEventListener('click', (e) => {
                    const rect = this.progressBar.getBoundingClientRect();
                    const percent = (e.clientX - rect.left) / rect.width;
                    this.seek(percent);
                });
            },
            
            setupAudioEvents() {
                this.audio.addEventListener('play', () => {
                    this.isPlaying = true;
                    this.updatePlayButton();
                    this.setStatus('online', 'AO VIVO');
                    this.startVisualizer();
                });
                
                this.audio.addEventListener('pause', () => {
                    this.isPlaying = false;
                    this.updatePlayButton();
                    this.stopVisualizer();
                });
                
                this.audio.addEventListener('ended', () => {
                    this.nextTrack();
                });
                
                this.audio.addEventListener('error', (e) => {
                    console.error('Erro no áudio:', e);
                    this.showError('Erro ao carregar áudio. Verifique sua conexão.');
                    this.setStatus('offline', 'Servidor Offline');
                });
                
                this.audio.addEventListener('timeupdate', () => {
                    this.updateProgress();
                });
                
                this.audio.addEventListener('waiting', () => {
                    this.setStatus('connecting', 'Buffering...');
                });
                
                this.audio.addEventListener('canplay', () => {
                    this.setStatus('online', 'AO VIVO');
                    this.hideError();
                });
            },
            
            async loadPlaylist() {
                try {
                    const baseUrl = this.getBaseUrl();
                    const response = await fetch(`${baseUrl}/api/playlist`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.success && data.tracks && data.tracks.length > 0) {
                        this.tracks = data.tracks;
                        this.renderPlaylist();
                        this.playlistCount.textContent = `${data.total} música${data.total !== 1 ? 's' : ''}`;
                        this.hideError();
                        
                        // Carregar primeira música
                        this.loadTrack(0);
                        this.setStatus('online', 'Pronto para tocar');
                    } else {
                        throw new Error('Nenhuma música encontrada');
                    }
                } catch (err) {
                    console.error('Erro ao carregar playlist:', err);
                    this.showError('Não foi possível carregar a playlist. Verifique se há músicas na pasta /audio.');
                    this.setStatus('offline', 'Servidor Offline');
                    
                    // Mostrar playlist vazia
                    this.playlist.innerHTML = `
                        <div style="text-align: center; padding: 30px; color: rgba(255,255,255,0.3);">
                            <p>📂 Nenhuma música disponível</p>
                            <p style="font-size: 12px; margin-top: 5px;">Adicione arquivos MP3 na pasta /audio</p>
                        </div>
                    `;
                }
            },
            
            renderPlaylist() {
                this.playlist.innerHTML = '';
                
                this.tracks.forEach((track, index) => {
                    const item = document.createElement('div');
                    item.className = `playlist-item ${index === this.currentTrackIndex ? 'active' : ''}`;
                    item.innerHTML = `
                        <div class="playlist-item-number">${index + 1}</div>
                        <div class="playlist-item-info">
                            <div class="playlist-item-title">${this.escapeHtml(track.name)}</div>
                        </div>
                        <div class="playlist-item-duration">▶</div>
                    `;
                    item.addEventListener('click', () => this.playTrack(index));
                    this.playlist.appendChild(item);
                });
            },
            
            loadTrack(index) {
                if (this.tracks.length === 0) return;
                
                this.currentTrackIndex = index;
                const track = this.tracks[index];
                const baseUrl = this.getBaseUrl();
                
                // Atualizar UI
                this.trackTitle.textContent = track.name;
                this.trackArtist.textContent = 'Rádio Amigos do Seu Zé';
                this.updatePlaylistActive();
                
                // Carregar áudio
                this.audio.src = `${baseUrl}${track.url}`;
                this.audio.load();
            },
            
            playTrack(index) {
                this.loadTrack(index);
                this.play();
            },
            
            togglePlay() {
                if (this.isPlaying) {
                    this.pause();
                } else {
                    this.play();
                }
            },
            
            play() {
                if (this.tracks.length === 0) {
                    this.showError('Nenhuma música na playlist');
                    return;
                }
                
                const playPromise = this.audio.play();
                
                if (playPromise !== undefined) {
                    playPromise.catch(err => {
                        console.error('Erro ao reproduzir:', err);
                        this.showError('Erro ao iniciar reprodução. Clique em Play novamente.');
                        this.setStatus('offline', 'Erro de reprodução');
                    });
                }
            },
            
            pause() {
                this.audio.pause();
            },
            
            stop() {
                this.audio.pause();
                this.audio.currentTime = 0;
                this.isPlaying = false;
                this.updatePlayButton();
                this.stopVisualizer();
                this.setStatus('online', 'Parado');
            },
            
            previousTrack() {
                if (this.tracks.length === 0) return;
                const newIndex = (this.currentTrackIndex - 1 + this.tracks.length) % this.tracks.length;
                this.playTrack(newIndex);
            },
            
            nextTrack() {
                if (this.tracks.length === 0) return;
                const newIndex = (this.currentTrackIndex + 1) % this.tracks.length;
                this.playTrack(newIndex);
            },
            
            toggleMute() {
                if (this.isMuted) {
                    this.audio.muted = false;
                    this.isMuted = false;
                    this.volumeSlider.value = this.previousVolume;
                    this.muteBtn.textContent = '🔊';
                } else {
                    this.previousVolume = this.volumeSlider.value;
                    this.audio.muted = true;
                    this.isMuted = true;
                    this.volumeSlider.value = 0;
                    this.muteBtn.textContent = '🔇';
                }
            },
            
            setVolume(value) {
                const volume = parseInt(value) / 100;
                this.audio.volume = volume;
                
                if (volume === 0) {
                    this.muteBtn.textContent = '🔇';
                    this.isMuted = true;
                } else {
                    this.muteBtn.textContent = '🔊';
                    this.isMuted = false;
                    this.audio.muted = false;
                }
            },
            
            seek(percent) {
                if (this.audio.duration) {
                    this.audio.currentTime = percent * this.audio.duration;
                }
            },
            
            updateProgress() {
                if (this.audio.duration) {
                    const percent = (this.audio.currentTime / this.audio.duration) * 100;
                    this.progressFill.style.width = `${percent}%`;
                    this.currentTime.textContent = this.formatTime(this.audio.currentTime);
                }
            },
            
            updatePlayButton() {
                this.playBtn.textContent = this.isPlaying ? '⏸' : '▶';
            },
            
            updatePlaylistActive() {
                const items = this.playlist.querySelectorAll('.playlist-item');
                items.forEach((item, index) => {
                    item.classList.toggle('active', index === this.currentTrackIndex);
                });
            },
            
            setStatus(type, text) {
                this.statusBadge.className = `status-badge ${type}`;
                this.statusText.textContent = text;
            },
            
            showError(message) {
                this.errorMessage.textContent = message;
                this.errorMessage.classList.add('show');
                setTimeout(() => this.hideError(), 8000);
            },
            
            hideError() {
                this.errorMessage.classList.remove('show');
            },
            
            formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            },
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },
            
            // Visualizer Animation
            startVisualizer() {
                const bars = this.visualizer.querySelectorAll('.bar');
                bars.forEach((bar, i) => {
                    bar.classList.add('active');
                    bar.style.animationDelay = `${i * 0.1}s`;
                    bar.style.animationDuration = `${0.3 + Math.random() * 0.4}s`;
                });
            },
            
            stopVisualizer() {
                const bars = this.visualizer.querySelectorAll('.bar');
                bars.forEach(bar => {
                    bar.classList.remove('active');
                    bar.style.height = '5px';
                });
            }
        };
        
        // Inicializar quando DOM estiver pronto
        document.addEventListener('DOMContentLoaded', () => {
            RadioPlayer.init();
        });
        
        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.log('SW registration failed:', err);
            });
        }
    </script>
</body>
</html>
