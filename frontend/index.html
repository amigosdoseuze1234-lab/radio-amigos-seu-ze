<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b141a">
    <meta name="format-detection" content="telephone=no">
    
    <!-- Cache control para evitar cache agressivo -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Rádio Amigos do Seu Zé</title>
    
    <!-- Manifest com version query para bust cache -->
    <link rel="manifest" href="manifest.json?v=2026.0708.1">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    
    <style>
        /* [TODO: Inserir o CSS completo do arquivo original] */
        /* O CSS permanece o mesmo, apenas sem duplicações */
    </style>
</head>
<body>
    <!-- Update Banner (NOVO) -->
    <div class="update-banner" id="updateBanner">
        <span>🔄 Nova versão disponível!</span>
        <button onclick="window.location.reload(true)">Atualizar</button>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🎧</div>
            <h1>Amigos do Seu Zé</h1>
        </div>
        <div class="status-badge connecting" id="statusBadge">
            <span class="status-dot"></span>
            <span id="statusText">Conectando...</span>
        </div>
    </div>

    <!-- [TODO: Resto do HTML do body permanece igual] -->
    
    <script>
    /**
     * Rádio Amigos do Seu Zé - Versão Corrigida
     * Auto-update, reconnect robusto, cache busting
     * @version 2026.0708.1
     */
    
    (function() {
        'use strict';

        // ===== CONFIGURAÇÃO CENTRALIZADA =====
        const CONFIG = {
            VERSION: '2026.0708.1',
            STREAM_URL: 'https://stream.zeno.fm/yn65fsaurfhvv',
            WS_URL: 'wss://chat.amigosdoseuze.com.br/ws',
            RECONNECT_INTERVAL: 3000,
            MAX_RECONNECT_ATTEMPTS: 10,
            PING_INTERVAL: 25000,
            PING_TIMEOUT: 10000,
            UPDATE_CHECK_INTERVAL: 60000, // 60 segundos
            STORAGE_KEY: 'radio_amigos_config'
        };

        // ===== GERENCIADOR DE ATUALIZAÇÃO (NOVO) =====
        const UpdateManager = {
            currentVersion: CONFIG.VERSION,
            checkTimer: null,
            
            init() {
                this.checkForUpdate();
                // Verificar a cada minuto
                this.checkTimer = setInterval(() => this.checkForUpdate(), CONFIG.UPDATE_CHECK_INTERVAL);
                
                // Verificar quando a aba volta ao foco
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) this.checkForUpdate();
                });
                
                // Verificar quando volta online
                window.addEventListener('online', () => this.checkForUpdate());
            },
            
            async checkForUpdate() {
                try {
                    const response = await fetch('version.json?v=' + Date.now(), {
                        method: 'HEAD',
                        cache: 'no-store',
                        headers: { 'Cache-Control': 'no-cache' }
                    });
                    
                    const serverVersion = response.headers.get('X-App-Version') || CONFIG.VERSION;
                    
                    if (serverVersion !== this.currentVersion) {
                        console.log('[Update] Nova versão:', serverVersion);
                        this.showUpdateBanner();
                    }
                } catch(e) {
                    // Silencioso - pode estar offline
                }
            },
            
            showUpdateBanner() {
                const banner = document.getElementById('updateBanner');
                if (banner) banner.classList.add('show');
            }
        };

        // ===== GERENCIADOR DE STREAM COM RECONNECT =====
        const StreamManager = {
            audio: null,
            isPlaying: false,
            reconnectAttempts: 0,
            reconnectTimer: null,
            
            init() {
                this.audio = document.createElement('audio');
                this.audio.crossOrigin = 'anonymous';
                this.audio.preload = 'none';
                document.body.appendChild(this.audio);
                
                this.setupEvents();
                this.loadStream();
            },
            
            setupEvents() {
                const audio = this.audio;
                
                audio.addEventListener('canplay', () => {
                    this.updateStatus('online', 'Ao Vivo');
                    this.reconnectAttempts = 0;
                });
                
                audio.addEventListener('playing', () => {
                    this.isPlaying = true;
                    this.updateStatus('online', 'Ao Vivo');
                    document.getElementById('albumArt')?.classList.add('playing');
                });
                
                audio.addEventListener('pause', () => {
                    this.isPlaying = false;
                    document.getElementById('albumArt')?.classList.remove('playing');
                });
                
                audio.addEventListener('waiting', () => {
                    this.updateStatus('buffering', 'Buffering...');
                });
                
                audio.addEventListener('error', () => this.handleError());
                audio.addEventListener('ended', () => this.reconnect());
                
                // Reconectar quando voltar à página
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden && this.isPlaying && audio.paused) {
                        this.reconnect();
                    }
                });
            },
            
            loadStream() {
                // Cache busting para evitar cache do navegador
                this.audio.src = CONFIG.STREAM_URL + '?_cb=' + Date.now();
                this.audio.load();
            },
            
            play() {
                const promise = this.audio.play();
                if (promise) {
                    promise.catch(err => {
                        if (err.name === 'NotAllowedError') {
                            // Mostrar overlay de interação necessária
                            document.getElementById('interactionOverlay')?.classList.add('show');
                        }
                    });
                }
            },
            
            reconnect() {
                if (this.reconnectAttempts >= CONFIG.MAX_RECONNECT_ATTEMPTS) {
                    this.updateStatus('offline', 'Offline');
                    return;
                }
                
                this.reconnectAttempts++;
                this.updateStatus('connecting', 'Reconectando...');
                
                clearTimeout(this.reconnectTimer);
                this.reconnectTimer = setTimeout(() => {
                    this.loadStream();
                    this.play();
                }, CONFIG.RECONNECT_INTERVAL);
            },
            
            updateStatus(type, text) {
                const badge = document.getElementById('statusBadge');
                const statusText = document.getElementById('statusText');
                if (badge) {
                    badge.className = 'status-badge ' + type;
                    if (statusText) statusText.textContent = text;
                }
            }
        };

        // ===== GERENCIADOR DE CHAT COM RECONNECT =====
        const ChatManager = {
            ws: null,
            userName: null,
            isConnected: false,
            reconnectTimer: null,
            pingTimer: null,
            pongReceived: true,
            reconnectAttempts: 0,
            messageQueue: [],
            
            init() {
                this.connect();
            },
            
            connect() {
                try {
                    this.ws = new WebSocket(CONFIG.WS_URL);
                    
                    this.ws.onopen = () => {
                        this.isConnected = true;
                        this.reconnectAttempts = 0;
                        this.startPingPong();
                        this.flushQueue();
                    };
                    
                    this.ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            if (data.type === 'pong') {
                                this.pongReceived = true;
                            }
                            // ... handle other message types
                        } catch(e) {}
                    };
                    
                    this.ws.onclose = () => {
                        this.isConnected = false;
                        this.stopPingPong();
                        this.scheduleReconnect();
                    };
                    
                } catch(e) {
                    this.scheduleReconnect();
                }
            },
            
            startPingPong() {
                this.pingTimer = setInterval(() => {
                    if (!this.pongReceived) {
                        this.ws?.close();
                        return;
                    }
                    this.pongReceived = false;
                    this.ws?.send(JSON.stringify({ type: 'ping' }));
                }, CONFIG.PING_INTERVAL);
            },
            
            stopPingPong() {
                if (this.pingTimer) {
                    clearInterval(this.pingTimer);
                    this.pingTimer = null;
                }
            },
            
            scheduleReconnect() {
                if (this.reconnectAttempts >= CONFIG.MAX_RECONNECT_ATTEMPTS) return;
                
                this.reconnectAttempts++;
                clearTimeout(this.reconnectTimer);
                this.reconnectTimer = setTimeout(() => this.connect(), CONFIG.RECONNECT_INTERVAL);
            },
            
            flushQueue() {
                while (this.messageQueue.length > 0) {
                    const msg = this.messageQueue.shift();
                    this.ws.send(JSON.stringify(msg));
                }
            }
        };

        // ===== INICIALIZAÇÃO =====
        document.addEventListener('DOMContentLoaded', () => {
            UpdateManager.init();
            StreamManager.init();
            ChatManager.init();
            
            // Configurar botões
            document.getElementById('playBtn')?.addEventListener('click', () => StreamManager.play());
            document.getElementById('interactionBtn')?.addEventListener('click', () => {
                document.getElementById('interactionOverlay')?.classList.remove('show');
                StreamManager.play();
            });
        });

        // Cleanup ao sair
        window.addEventListener('beforeunload', () => {
            UpdateManager.destroy?.();
            StreamManager.destroy?.();
            ChatManager.destroy?.();
        });

    })();
    </script>
</body>
</html>
